name: Build & Release

# Two ways to cut a release:
#   • From your PHONE / browser: Actions tab → "Build & Release" → Run workflow
#       → type the version (e.g. 2.0.3) → Run. CI bumps the version, builds the
#       installer, and publishes the GitHub Release.
#   • From a PC: `python push_update.py 2.0.3 "notes"` (pushes a v* tag).
#
# Installed apps auto-update from the published Release (see taf_order_app/updater.py).
# Requires the SUPABASE_ANON_KEY Actions secret and a public repo.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 2.0.3'
        required: true
      notes:
        description: 'Release notes (optional; auto-generated if blank)'
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag:     ${{ steps.ver.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
            echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Version must look like 2.0.3"; exit 1; }
            echo "bump=true" >> "$GITHUB_OUTPUT"
          else
            V="${GITHUB_REF_NAME#v}"
            echo "bump=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V"    >> "$GITHUB_OUTPUT"
          echo "Releasing v$V"

      - name: Bump version, commit & tag (phone/dispatch only)
        if: steps.ver.outputs.bump == 'true'
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          sed -i -E 's/APP_VERSION = "[^"]+"/APP_VERSION = "'"$V"'"/' taf_order_app/updater.py
          sed -i -E 's/^AppVersion=.*/AppVersion='"$V"'/'            installer.iss
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add taf_order_app/updater.py installer.iss
          git commit -m "Release v$V" || echo "no version change to commit"
          git push origin "HEAD:${{ github.ref_name }}"
          git tag -f "v$V"
          git push origin "v$V" --force

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check (fail fast before shipping)
        shell: bash
        run: python -m compileall -q modern_order_gui.py pdf_generator.py template_filler.py taf_order_app

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # A published release auto-updates every PC immediately and there is no
      # staging, so this is the only gate between a broken rule and everyone
      # using it.
      #
      # This used to run before the install, to fail a minute sooner. That
      # only held while every test was dependency-free, and it stopped being
      # true without anyone noticing: the barcode and label tests need
      # reportlab, so they failed here on a tree that was perfectly fine.
      # A gate that reports a missing package as a broken build is worse than
      # a gate that takes another minute.
      - name: Tests (fail fast before shipping)
        run: python tests/run.py

      # The tests above check the rules; this starts the actual window and
      # builds every tab and dialog against a stand-in database. It is what
      # catches a method that was called but never written, or two cards put
      # in the same grid cell - neither of which shows up in a diff. Runs
      # once as a manager and once as everyone else, because rights decide
      # which half of some screens gets built.
      - name: Smoke test (build every screen)
        timeout-minutes: 10
        run: python tests/smoke_gui.py

      - name: Write settings.json from secret
        shell: bash
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          cat > settings.json <<EOF
          {
            "custom_media_types": [],
            "supabase_anon_key": "${SUPABASE_ANON_KEY}"
          }
          EOF
          echo "settings.json written (key hidden)."

      - name: Fetch SumatraPDF helper (viewer-free PDF printing)
        shell: bash
        run: |
          # SumatraPDF prints PDFs straight to a named printer with no PDF
          # viewer. We get it from the pinned `pdf-to-printer` npm package,
          # which vendors it — the npm registry is reliably reachable from CI
          # (columbia.edu, the original PDFtoPrinter host, 403s datacenter IPs).
          TARBALL="https://registry.npmjs.org/pdf-to-printer/-/pdf-to-printer-5.8.0.tgz"
          for i in 1 2 3; do
            curl -fL --retry 3 -o p2p.tgz "$TARBALL" && break
            echo "npm tarball attempt $i failed"; sleep 3
          done
          tar xzf p2p.tgz 2>/dev/null || true
          cp package/dist/SumatraPDF-*.exe SumatraPDF.exe 2>/dev/null || true
          if [ -f SumatraPDF.exe ] && [ "$(stat -c%s SumatraPDF.exe 2>/dev/null || echo 0)" -gt 1000000 ] \
             && head -c2 SumatraPDF.exe | grep -q "MZ"; then
            echo "SumatraPDF.exe bundled ($(stat -c%s SumatraPDF.exe) bytes)."
          else
            echo "::error::SumatraPDF.exe not obtained — printing would fall back to the PDF-viewer path. Failing the build so a broken print feature isn't shipped."
            rm -f SumatraPDF.exe
            exit 1
          fi
          rm -rf package p2p.tgz

      - name: Build app (PyInstaller)
        run: pyinstaller --noconfirm --clean TAFOrderEntry.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Publish GitHub Release (setup.exe)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through the environment, never interpolated into the script.
          # Substituting it inline meant notes containing a double quote (or a
          # newline) broke the shell quoting and the release silently fell back
          # to auto-generated notes — which is what the app shows as "What's
          # New", so the actual notes never reached anyone.
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          printf '%s' "$NOTES" > release_notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ -s release_notes.md ]; then
              gh release edit "$TAG" --title "TAF Order Entry $TAG" \
                --notes-file release_notes.md
            fi
          elif [ -s release_notes.md ]; then
            gh release create "$TAG" --title "TAF Order Entry $TAG" \
              --notes-file release_notes.md
          else
            gh release create "$TAG" --title "TAF Order Entry $TAG" --generate-notes
          fi

          gh release upload "$TAG" "TAFOrderEntry_Setup.exe" --clobber

          # The notes are what the app shows after updating, so a release that
          # lost them is a defect worth failing on rather than shipping quietly.
          if [ -s release_notes.md ]; then
            gh release view "$TAG" --json body -q .body > published_notes.txt
            head -c 60 release_notes.md > expected_head.txt
            grep -qF "$(cat expected_head.txt)" published_notes.txt || {
              echo "::error::Release notes were not published correctly."
              exit 1
            }
            echo "Release notes published ($(wc -c < release_notes.md) bytes)."
          fi

  # ── The Mac build ──────────────────────────────────────────────────────────
  # Separate job, after the Windows one, for two reasons. PyInstaller cannot
  # cross-compile, so a Mac app has to be built on a Mac; and the release is
  # already published by then, so if anything here goes wrong the factory's
  # own PCs still get their update.
  #
  # Two of them, because Intel and Apple Silicon are different builds and
  # neither runs the other's without Rosetta being involved. macos-14 is
  # Apple Silicon; macos-15-intel is the Intel one. It used to be macos-13,
  # which GitHub has since retired - a retired label does not fail, it queues
  # forever, so the Intel job sat there while the other finished in a minute.
  mac:
    needs: release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            label:  Intel
          - runner: macos-14
            label:  AppleSilicon

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The Windows job may have just bumped the version and pushed it.
          # Checking out the tag is how this build gets the same number in
          # the app rather than the one from before the bump.
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The Windows job already ran the full suite and the smoke test on the
      # same commit. This is the part that is genuinely different here: the
      # modules have to import on a machine with no pywin32 at all, which is
      # exactly what breaks when a Windows-only import creeps back in.
      - name: Everything imports without pywin32
        run: |
          python -m compileall -q modern_order_gui.py pdf_generator.py template_filler.py taf_order_app
          python -c "import template_filler, pdf_generator; from taf_order_app import db, updater, paths, order_service, bag_filler; print('imports clean')"

      - name: Tests
        run: python tests/run.py

      - name: Write settings.json from secret
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is not set."
            exit 1
          fi
          cat > settings.json <<EOF
          {
            "custom_media_types": [],
            "supabase_anon_key": "${SUPABASE_ANON_KEY}"
          }
          EOF

      # One logo, not two. Built here from the artwork the app already
      # ships, so nobody has to remember to update a second icon file.
      - name: Make the app icon
        run: |
          python make_mac_icon.py --icns
          ls -l TAF_logo.icns

      - name: Build app (PyInstaller)
        env:
          TAF_VERSION: ${{ needs.release.outputs.version }}
        run: pyinstaller --noconfirm --clean TAFOrderEntry.spec

      # An unsigned app on Apple Silicon is killed on launch, not warned
      # about. Ad-hoc signing is what makes it run at all; it does not make
      # Gatekeeper trust it, which is what the note in the disk image is for.
      - name: Sign it ad-hoc
        run: |
          codesign --force --deep --sign - "dist/TAF Order Entry.app"
          codesign --verify --verbose=2 "dist/TAF Order Entry.app"

      # Not a screenshot test - nothing here can tell whether the window
      # looks right. What it does tell you is that every module the app needs
      # actually made it into the bundle, which is the failure PyInstaller is
      # most likely to hand you and the one that is invisible in a diff.
      - name: It at least starts
        timeout-minutes: 5
        run: |
          set +e
          out=$("dist/TAF Order Entry.app/Contents/MacOS/TAFOrderEntry" --version 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ] || ! echo "$out" | grep -q "TAF Order Entry"; then
            echo "::error::The packaged app could not start: $out"
            exit 1
          fi

      - name: Make the disk image
        id: dmg
        env:
          V: ${{ needs.release.outputs.version }}
        run: |
          set -e
          NAME="TAFOrderEntry-${V}-${{ matrix.label }}.dmg"
          mkdir -p stage
          cp -R "dist/TAF Order Entry.app" stage/
          ln -s /Applications "stage/Applications"
          cat > "stage/READ ME FIRST.txt" <<'EOF'
          TAF Order Entry — installing on a Mac
          =====================================

          1. Drag "TAF Order Entry" onto the Applications folder beside it.
          2. Open Applications, then right-click TAF Order Entry and choose
             Open. Click Open again when it asks.

          Step 2 matters the first time only. The app is not signed with an
          Apple Developer certificate — that is a paid yearly thing, and this
          is an internal tool — so macOS does not recognise who made it and
          will not open it on a plain double-click.

          If it says the app "is damaged and can't be opened", it is not.
          That is the same block wearing a different hat. Open Terminal
          (Applications → Utilities) and paste this line, then press Return:

              xattr -cr "/Applications/TAF Order Entry.app"

          Then open it normally. You only ever do this once.

          Updates from inside the app handle this themselves.
          EOF
          hdiutil create -volname "TAF Order Entry" -srcfolder stage \
                         -ov -format UDZO "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.tag }}" "${{ steps.dmg.outputs.name }}" --clobber
