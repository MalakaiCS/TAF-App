<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B3A5C">
<meta name="robots" content="noindex, nofollow">
<title>Total Air Filtration &middot; Orders</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231B3A5C'/%3E%3Ctext x='50' y='68' font-size='54' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
<!--
  The staff web app: the same orders, customers and stock as the Windows app,
  on a phone or a tablet on the factory floor.

  What it deliberately does NOT do is generate worksheets. Those are built by
  driving Excel and Word through COM, which only runs on Windows - so making
  an order's paperwork stays on the desktop app, and this is everything else.

  Signing in uses the same staff accounts. The publishable key in the page
  opens nothing on its own: every table has row-level security, and the
  anonymous role has no access to any of them. That is also why
  migrate_staff_access.sql is not optional before this goes live - without
  it, anyone who can register can read everything, and this puts a login box
  on the open internet.

  On GitHub Pages, not Supabase: Supabase serves what it hosts as text/plain
  under a sandbox CSP, so this would arrive as unstyled source with every
  script blocked.
-->
<style>
  :root {
    --navy:#1B3A5C; --blue:#2E6DA4; --brand:#1DA1E6; --bg:#F4F6F8;
    --card:#FFFFFF; --text:#1F2933; --muted:#6B7A8C; --line:#DCE3EA;
    --tint:#F5F8FB; --green:#1E8E5A; --red:#C0392B; --amber:#8A6D00;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         padding-bottom:env(safe-area-inset-bottom); }
  .hidden { display:none !important; }

  header { background:var(--navy); color:#fff; padding:14px 16px;
           padding-top:calc(14px + env(safe-area-inset-top));
           display:flex; align-items:center; gap:12px; }
  header h1 { margin:0; font-size:17px; flex:1; }
  header .who { font-size:13px; color:#A9CCE3; text-align:right; }
  header .who strong { display:block; color:#fff; font-size:14px; }
  header button { background:rgba(255,255,255,.14); border:0; color:#fff;
                  font:600 13px/1 inherit; padding:9px 12px; border-radius:8px;
                  cursor:pointer; }

  nav { background:var(--navy); display:flex; gap:2px; padding:0 8px;
        overflow-x:auto; }
  nav button { flex:0 0 auto; background:transparent; border:0; color:#A9CCE3;
               font:600 14px/1 inherit; padding:13px 14px; cursor:pointer;
               border-bottom:3px solid transparent; }
  nav button[aria-selected="true"] { color:#fff; border-bottom-color:#fff; }

  main { padding:14px; max-width:1100px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line);
          border-radius:12px; padding:16px; margin-bottom:14px; }
  h2 { margin:0 0 12px; font-size:14px; color:var(--navy);
       text-transform:uppercase; letter-spacing:.04em; }

  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:11px 8px; text-align:left; border-bottom:1px solid var(--line);
           vertical-align:top; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.03em;
       color:var(--muted); }
  td.num, th.num { text-align:right; white-space:nowrap; }
  tbody tr.row { cursor:pointer; }
  tbody tr:nth-child(even) { background:var(--tint); }
  tbody tr.late td { background:#FCE9E6; color:#8A2A1E; }
  tbody tr.today td { background:#FDF3E0; }
  .wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }

  /* A status reads the same wherever it appears. Without this the heading's
     text-transform reaches into the pill and "Complete" becomes "COMPLETE"
     in the order window but not in the list next to it. */
  .pill { display:inline-block; padding:4px 10px; border-radius:999px;
          font-size:12px; font-weight:700; white-space:nowrap;
          text-transform:none; letter-spacing:normal; }
  .s-Pending        { background:#EAEEF2; color:#48576A; }
  .s-InProduction   { background:#FEF6E0; color:var(--amber); }
  .s-Complete       { background:#E4F4EA; color:var(--green); }
  .s-Dispatched     { background:#E4EEF8; color:var(--blue); }

  button.btn { background:var(--brand); border:0; color:#fff; cursor:pointer;
               font:700 14px/1 inherit; padding:12px 16px; border-radius:9px; }
  button.btn.quiet { background:#E7F4FC; color:#1179B5; }
  button.btn.go    { background:var(--green); }
  button.btn:disabled { opacity:.5; cursor:default; }
  .row-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }

  input[type=text], input[type=email], input[type=password], input[type=search],
  select, textarea {
    width:100%; font:15px/1.4 inherit; color:var(--text);
    padding:11px 12px; border:1px solid var(--line); border-radius:9px;
    background:#fff; }
  label.f { display:block; margin-bottom:10px; font-size:13px;
            color:var(--muted); }
  label.f span { display:block; margin-bottom:4px; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; }
  .filters label.f { flex:1 1 150px; margin-bottom:0; }

  /* Ticking a line off. Big enough to hit with a glove on. */
  .tick { width:34px; height:34px; border-radius:8px; border:2px solid var(--line);
          background:#fff; cursor:pointer; font-size:18px; line-height:1;
          color:var(--green); padding:0; }
  .tick[aria-pressed="true"] { background:#E4F4EA; border-color:var(--green); }
  tr.made td { background:#EAF7EE; }

  .muted { color:var(--muted); font-size:13px; }
  .empty { text-align:center; color:var(--muted); padding:30px 10px; }
  .err { background:#FCE9E6; border:1px solid #E9BDB5; color:#8A2A1E;
         padding:12px 14px; border-radius:9px; margin-bottom:12px;
         font-size:14px; }
  .ok  { background:#E4F4EA; border:1px solid #B7DFC7; color:#12684A;
         padding:12px 14px; border-radius:9px; margin-bottom:12px;
         font-size:14px; }

  /* Sign in */
  #signin { max-width:380px; margin:9vh auto; padding:0 16px; }
  #signin .card { padding:22px; }
  #signin h1 { font-size:20px; margin:0 0 4px; color:var(--navy); }
  #signin p.sub { margin:0 0 18px; color:var(--muted); font-size:14px; }
  .taf-logo { height:34px; }

  /* A sheet that slides over the list, for one order */
  #sheet { position:fixed; inset:0; background:rgba(16,32,45,.45);
           display:flex; align-items:flex-end; justify-content:center;
           z-index:20; }
  #sheet > div { background:var(--bg); width:100%; max-width:900px;
                 max-height:92vh; overflow:auto; border-radius:14px 14px 0 0;
                 padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom)); }
  #sheet h2 { display:flex; align-items:center; gap:10px; }
  @media (min-width:700px) {
    #sheet { align-items:center; }
    #sheet > div { border-radius:14px; max-height:88vh; }
  }
</style>
</head>
<body>

<!-- ── Signing in ──────────────────────────────────────────────────────── -->
<section id="signin">
  <div class="card">
    <header id="signin-head" style="background:none;padding:0;display:block">
      <h1>Total Air Filtration</h1>
      <p class="sub">Orders, stock and customers. Sign in with your usual
        account.</p>
    </header>
    <form id="signin-form">
      <label class="f"><span>Email</span>
        <input type="email" id="email" autocomplete="username" required></label>
      <label class="f"><span>Password</span>
        <input type="password" id="password" autocomplete="current-password"
               required></label>
      <button class="btn" id="signin-go" style="width:100%" type="submit">
        Sign in</button>
    </form>
  </div>
  <div id="signin-foot"></div>
</section>

<!-- ── The app ─────────────────────────────────────────────────────────── -->
<div id="app" class="hidden">
  <header>
    <h1 id="app-title">Total Air Filtration</h1>
    <div class="who"><strong id="who-name">—</strong><span id="who-role"></span></div>
    <button id="signout" type="button">Sign out</button>
  </header>
  <nav id="tabs" role="tablist"></nav>
  <main id="screen"></main>
</div>

<div id="sheet" class="hidden"><div id="sheet-body"></div></div>

<script src="../company.js"></script>
<script src="../taf-shared.js"></script>
<!-- Written by the "Publish the web app key" workflow. Missing until that
     has been run once, which is why this is allowed to 404 quietly. -->
<script src="config.js" onerror="void 0"></script>
<script src="data.js"></script>
<script src="ui.js"></script>
<script src="screens.js"></script>
<script>
"use strict";
/*
  The publishable key comes in on the link the first time and is remembered,
  exactly as the customer portal does it — and then taken out of the address
  bar, so it is not left behind in a screenshot or a shared browser history.

  It is not committed to this repository. It is public in the sense that it
  ships inside the Windows installer and rides in every portal link, but
  writing it into a file in a public repo is a different thing: it would then
  outlive any decision to rotate it. The desktop app hands out the link.
*/
var params = new URLSearchParams(location.search);

function remembered(param, store) {
  var fresh = (params.get(param) || "").trim();
  if (fresh) {
    try { localStorage.setItem(store, fresh); } catch (e) {}
    return fresh;
  }
  try { return localStorage.getItem(store) || ""; } catch (e) { return ""; }
}

// config.js is written by CI from the same secret the installer is built
// with, so opening this address on any phone just works — no PC, nothing to
// scan, nothing to paste. A key on the link still wins, which is what makes
// a second Supabase project testable without editing anything.
var KEY = remembered("k", "taf_staff_key") || (window.TAF_KEY || "").trim();
if (params.get("k")) {
  try { history.replaceState({}, "", location.pathname); } catch (e) {}
}

TAFDATA.boot("https://djexdkwohkylunnwbxpf.supabase.co", KEY);
TAFAPP.start(KEY);
</script>
</body>
</html>
